<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
	@font-face {
		font-family: 'Bricolage';
		src: url('file:///Users/conde/projects/vps/sites/confetti/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
		font-weight: 200 800;
	}
	@font-face {
		font-family: 'Inter';
		src: url('file:///Users/conde/projects/vps/sites/confetti/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
		font-weight: 100 900;
	}
	* { margin: 0; box-sizing: border-box; }
	body {
		width: 1200px;
		height: 630px;
		background: #0b0a10;
		font-family: 'Inter', sans-serif;
		color: #f4f1ea;
		overflow: hidden;
		position: relative;
		display: flex;
		flex-direction: column;
		justify-content: center;
		padding: 0 88px;
	}
	.blob { position: absolute; border-radius: 50%; filter: blur(110px); }
	.blob1 { width: 520px; height: 520px; background: rgba(139, 92, 246, 0.32); top: -220px; left: -120px; }
	.blob2 { width: 460px; height: 460px; background: rgba(217, 70, 239, 0.24); bottom: -220px; right: -80px; }
	.blob3 { width: 320px; height: 320px; background: rgba(251, 191, 36, 0.14); top: 40px; right: 240px; }
	.badge {
		position: relative;
		display: inline-flex;
		align-items: center;
		gap: 12px;
		background: rgba(255,255,255,0.05);
		border: 1.5px solid rgba(255,255,255,0.12);
		border-radius: 999px;
		padding: 12px 26px;
		font-size: 22px;
		letter-spacing: 0.18em;
		text-transform: uppercase;
		color: rgba(255,255,255,0.65);
		font-weight: 600;
		width: fit-content;
	}
	.dot { width: 12px; height: 12px; border-radius: 50%; background: #34d399; }
	h1 {
		position: relative;
		font-family: 'Bricolage', sans-serif;
		font-size: 86px;
		white-space: nowrap;
		font-weight: 780;
		line-height: 1.02;
		letter-spacing: -0.02em;
		margin-top: 34px;
	}
	.grad {
		background: linear-gradient(100deg, #a78bfa 0%, #e879f9 45%, #fcd34d 100%);
		-webkit-background-clip: text;
		background-clip: text;
		color: transparent;
	}
	.chips { position: relative; display: flex; gap: 16px; margin-top: 44px; }
	.chip {
		background: rgba(255,255,255,0.055);
		border: 1.5px solid rgba(255,255,255,0.12);
		border-radius: 999px;
		padding: 16px 30px;
		font-size: 27px;
		font-weight: 600;
		color: rgba(244,241,234,0.92);
	}
	.chip strong { font-weight: 800; color: #fff; }
	.footer {
		position: absolute;
		bottom: 44px;
		left: 88px;
		right: 88px;
		display: flex;
		align-items: center;
		justify-content: space-between;
	}
	.url {
		font-family: 'Bricolage', sans-serif;
		font-size: 27px;
		font-weight: 700;
		color: rgba(255,255,255,0.45);
	}
	.cta {
		background: linear-gradient(100deg, #8b5cf6, #d946ef 55%, #fbbf24);
		border-radius: 999px;
		padding: 18px 38px;
		font-size: 27px;
		font-weight: 800;
		font-family: 'Bricolage', sans-serif;
		color: #fff;
	}
</style>
</head>
<body>
	<div class="blob blob1"></div>
	<div class="blob blob2"></div>
	<div class="blob blob3"></div>
	<div class="badge"><span class="dot"></span> Convite oficial · Edição limitada</div>
	<h1>Aniversário do <span class="grad">Conde</span> 🎉</h1>
	<div class="chips">
		<div class="chip">📅 <strong>Sáb, 22 de agosto</strong></div>
		<div class="chip">🕛 <strong>meio-dia</strong></div>
		<div class="chip">🔥 <strong>churrasco</strong></div>
	</div>
	<div class="footer">
		<div class="url">festa.oconde.dev</div>
		<div class="cta">Confirmar presença →</div>
	</div>
</body>
</html>
